[package]
name = "tagimage-db"
version = "0.1.0"
edition = "2021"

[dependencies]
tagimage-core = { path = "../tagimage-core" }
tokio-postgres = { version = "0.7.12", features = ["with-serde_json-1"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
