services:
  postgres:
    image: postgres:16-alpine
    container_name: imgviewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imgviewer
      POSTGRES_USER: imgviewer
      POSTGRES_PASSWORD: imgviewer
    ports:
      - "5432:5432"
    volumes:
      - imgviewer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgviewer -d imgviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  imgviewer-postgres:
